name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Run the playbook hook and script tests
        run: for t in agent-playbooks/ross-mode/{hooks,scripts}/test-*.sh; do bash "$t" || exit 1; done
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose .'

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t meta-checker .
      - run: docker run -d --name meta-checker -p 3000:3000 meta-checker
      - name: Request the page
        run: |
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/tools/meta-checker && break; sleep 1; done
          test "$(curl -sS -o page.html -w '%{http_code}' http://localhost:3000/tools/meta-checker)" = 200
          grep -q '>Check<' page.html
          asset=$(grep -o '/tools/meta-checker/_next/static/[^"]*\.js' page.html | sed -n 1p)
          test -n "$asset"
          curl -sf -o /dev/null "http://localhost:3000$asset"
      - if: always()
        run: docker logs meta-checker
